<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="login">
    <div class="login__content">
      <div class="login__form-wrapper">
        <h1 class="login__title">Bem-vindo de volta <span>👋</span></h1>

        <p class="login__error" id="login-error" hidden>Usuário ou senha inválidos.</p>

        <form action="/login" method="post" class="login__form" novalidate>
          <div class="login__group">
            <div class="login__box">
              <i class="ri-user-fill login__icon"></i>
              <input type="text" name="username" autocomplete="username" required placeholder=" " class="login__input" id="username">
              <label for="username" class="login__label">Usuário</label>
            </div>

            <div class="login__box">
              <i class="ri-lock-2-fill login__icon"></i>
              <input type="password" name="password" autocomplete="current-password" required placeholder=" " class="login__input" id="password">
              <label for="password" class="login__label">Senha</label>
            </div>
          </div>

          <a href="#" class="login__forgot">Esqueceu a senha?</a>

          <button type="submit" class="login__button">
            Entrar <i class="ri-send-plane-2-fill"></i>
          </button>

          <p class="login__sign">
            Não tem uma conta? <a href="#">Cadastre-se</a>
          </p>
        </form>
      </div>

      <div class="login__image">
        <img src="assets/img/login-illustration.svg" alt="" class="login__img">
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
